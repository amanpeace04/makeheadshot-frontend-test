name: Deploy Frontend to EC2

on:
  push:
    branches:
      - feature/mak-2-ap  # ya jo bhi branch tu push karega

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            cd /root/Makeheadshot-Frontend-Final
            git fetch origin
            git checkout feature/mak-2-ap
            git pull origin feature/mak-2-ap

            # Build & deploy via Docker (adjust according to setup)
            docker build -t makeheadshot-frontend .
            docker stop makeheadshot-frontend || true
            docker rm makeheadshot-frontend || true
            docker run -d --name makeheadshot-frontend -p 31174:3000 makeheadshot-frontend

            # OR if using docker-compose:
            # docker-compose down
            # docker-compose up -d --build
