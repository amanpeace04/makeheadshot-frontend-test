name: Frontend Deployment (Docker - Feature Branch)

on:
  push:
    branches:
      - feature/mak-2-ap

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Deploy Frontend via Docker
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            cd /root/Makeheadshot-Frontend-Final
            git fetch origin
            git checkout feature/mak-2-ap
            git pull origin feature/mak-2-ap

            # Docker commands
            docker build -t makeheadshot-frontend .
            docker stop makeheadshot-frontend || true
            docker rm makeheadshot-frontend || true
            docker run -d --name makeheadshot-frontend -p 31174:3000 makeheadshot-frontend
