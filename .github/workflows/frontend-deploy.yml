name: Frontend Deploy - Feature Branch

on:
  push:
    branches:
      - feature/mak-2-ap

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: 13.233.8.81
          username: ubuntu
          port: 22
          key: ${{ secrets.FRONTEND_KEY }}
          script: |
            cd /home/ubuntu/Makeheadshot-Frontend-Final
            git fetch origin
            git checkout feature/mak-2-ap
            git pull --no-rebase origin feature/mak-2-ap
            npm install
            npm run build
            pm2 delete frontend || true
            pm2 start npm --name "frontend" -- start
            pm2 save
